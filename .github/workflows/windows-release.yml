name: Windows build and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:/Qt --modules qtsvg qtshadertools

      - name: Configure
        shell: pwsh
        run: |
          $pythonRoot = Split-Path (Get-Command python).Source
          cmake -S . -B build -A x64 -DPython3_ROOT_DIR="$pythonRoot" -DCMAKE_PREFIX_PATH="C:/Qt/6.8.3/msvc2022_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package with embedded Python
        shell: pwsh
        run: ./tools/package-windows.ps1

      - name: Test the packaged application
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'flowdeck-package-test'
          Expand-Archive -LiteralPath dist/FlowDeck-windows-x64.zip -DestinationPath $testRoot -Force
          $exe = Join-Path $testRoot 'FlowDeck-x64/flowdeck.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed with exit code $($process.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: FlowDeck-windows-x64
          path: dist/FlowDeck-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            gh release create $tag dist/FlowDeck-windows-x64.zip --verify-tag --title $tag --generate-notes
          } else {
            $tag = "build-$env:GITHUB_RUN_NUMBER"
            gh release create $tag dist/FlowDeck-windows-x64.zip --target $env:GITHUB_SHA --title "Development build $env:GITHUB_RUN_NUMBER" --prerelease --generate-notes
          }
